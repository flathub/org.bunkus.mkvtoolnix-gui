app-id: org.bunkus.mkvtoolnix-gui
default-branch: stable
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mkvtoolnix
rename-icon: mkvtoolnix-gui
finish-args:
  - --socket=wayland
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
cleanup:
  - /bin/cmark
  - /gems
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc/libdvdcss/*.css
  - /share/doc/libdvdcss/*.html
  - /share/doc/libdvdcss/*.png
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=filesystem,system
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
        sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c

  - name: cmark
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMARK_STATIC=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/commonmark/cmark/archive/refs/tags/0.31.2.tar.gz
        sha256: f9bc5ca38bcb0b727f0056100fac4d743e768872e3bacec7746de28f5700d697

  - name: libdvdcss
    sources:
      - type: archive
        url: https://download.videolan.org/pub/libdvdcss/1.4.3/libdvdcss-1.4.3.tar.bz2
        sha256: 233cc92f5dc01c5d3a96f5b3582be7d5cee5a35a52d3a08158745d3d86070079

  - name: libdvdread
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/6.1.3/libdvdread-6.1.3.tar.bz2
        sha256: ce35454997a208cbe50e91232f0e73fb1ac3471965813a13b8730a8f18a15369

  - name: mkvtoolnix
    buildsystem: simple
    build-commands:
      # - ./autogen.sh
      - ./configure
        --enable-optimization
        --enable-debug
        --prefix=/app
        --with-boost=/app
        --with-docbook-xsl-root=/usr/share/xml/docbook/xml/xsl-stylesheets
        --with-qmake6=/usr/bin/qmake
        --disable-update-check
      - ./drake -j $FLATPAK_BUILDER_N_JOBS
      - sed -i -Ee '/<mimetypes>/,/<.mimetypes>/d' share/metainfo/org.bunkus.mkvtoolnix-gui.metainfo.xml
      - ./drake install
      - mkdir -p /app/share/doc/mkvtoolnix
      - install -m0644 -t/app/share/doc/mkvtoolnix AUTHORS CODE_OF_CONDUCT.md COPYING README.md
    sources:
      - type: archive
        url: https://mkvtoolnix.download/sources/mkvtoolnix-104.0.tar.xz
        sha256: 8f07b39d6cea1aad029f253e0e6e6a54c0e0f3ba91bfc3b2157915630d48a62b
      # - type: git
      #   url: https://gitlab.com/mbunkus/mkvtoolnix.git
      #   branch: main
      #   commit: 29f4f99e1b046c53812b90309badef4915db8510
    modules:
      - name: ruby
        sources:
          - type: archive
            url: https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.10.tar.gz
            sha256: b53eef3371fa5d3e3b74340edcd015f06d5d8853968d4e539a5264fce41ed9f1
            x-checker-data:
              type: anitya
              project-id: 4223
              url-template: https://cache.ruby-lang.org/pub/ruby/${major}.${minor}/ruby-${version}.tar.gz
        cleanup:
          - '*'

  - name: mkvtoolnix-wrapper
    buildsystem: simple
    build-commands:
      - install -m0755 entrypoint.sh /app/bin/mkvtoolnix
    sources:
      - type: file
        path: entrypoint.sh

  - name: cmark-docs
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/doc/cmark
      - install -m0644 -t/app/share/doc/cmark COPYING README.md
    sources:
      - type: archive
        url: https://mkvtoolnix.download/sources/mkvtoolnix-104.0.tar.xz
        sha256: 8f07b39d6cea1aad029f253e0e6e6a54c0e0f3ba91bfc3b2157915630d48a62b
